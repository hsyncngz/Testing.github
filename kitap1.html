<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dijital Kitaplık - Fiyat Listeleri</title>
  <style>
    :root {
      --bg-color: #1e222d;
      --card-bg: #2a2e3d;
      --card-hover: #34394a;
      --text-color: #ffffff;
      --border-radius: 12px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      padding: 20px;
      min-height: 100vh;
    }

    .grid-container {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 20px;
      max-width: 1200px;
      margin: 0 auto;
    }

    @media (max-width: 900px) {
      .grid-container {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    @media (max-width: 550px) {
      .grid-container {
        grid-template-columns: 1fr;
      }
    }

    .book-card {
      background-color: var(--card-bg);
      border-radius: var(--border-radius);
      padding: 15px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-decoration: none;
      color: var(--text-color);
      transition: transform 0.2s, background-color 0.2s;
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
    }

    .book-card:hover {
      transform: translateY(-5px);
      background-color: var(--card-hover);
    }

    .cover-wrapper {
      width: 100%;
      aspect-ratio: 3 / 4;
      overflow: hidden;
      border-radius: 8px;
      background-color: #181b23;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 12px;
    }

    .cover-image {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .book-title {
      font-size: 0.95rem;
      font-weight: 700;
      letter-spacing: 0.5px;
      text-align: center;
      text-transform: uppercase;
    }
  </style>
</head>
<body>

  <div class="grid-container" id="book-grid">
    <!-- Kitap Kartları JavaScript Tarafından Otomatik Üretilir -->
  </div>

  <script>
    const BASE_PDF_URL = "https://www.ozbekenerji.com.tr/uploads/fiyat-listeleri/pdf/Listeler/";
    const BASE_COVER_URL = "https://www.ozbekenerji.com.tr/uploads/fiyat-listeleri/pdf/Listeler/kapaklar/";

    // Kitap İsimleri Listesi
    const books = [
      "ABB", "ACK", "ADAL", "ARS", "ARVIA", "AUDIO", "AYKA", "BEMIS", 
      "CATA", "CHINT", "ÇEBİ", "ÇET-SAN", "DÜNYA LED", "ELMAX", "EMAS", 
      "ENTES", "ERKLED", "ERNA", "FANSAN", "FAR", "FETİH", "FORLIFE", 
      "GOYA", "GWEST", "HASÇELİK", "HELİOS", "HES", "HIGHTEK", "HOROZ", 
      "İNOLED", "IŞILDAR", "K2", "KONREX", "LEGRAND", "MAKEL", "METOP", 
      "MULTİTEK", "MUTLUSAN", "NEAD", "NETAPLAST", "NOAS", "NTS", "OAG", 
      "OREL", "OVİVO WOG", "OVİVO", "ÖZKARAKUŞ", "ÖZKARDEŞLER", "ÖZNUR", 
      "PELSAN", "REÇBER", "SİGMA", "TEKNOLOJİ", "TENSE", "TK", "UGEST", 
      "VİKO", "WALL LED", "YCL", "ZERPA", "ZMR"
    ];

    function renderLibrary() {
      const grid = document.getElementById('book-grid');
      const now = new Date().getTime(); // Açılışta kapak güncelleme kontrolü (cache-busting)

      books.forEach(book => {
        const bookUrl = `${BASE_PDF_URL}${encodeURIComponent(book)}.html`;
        const coverUrl = `${BASE_COVER_URL}${encodeURIComponent(book)}.jpg?v=${now}`;

        const card = document.createElement('a');
        card.className = 'book-card';
        card.href = bookUrl; // Aynı pencerede açılması için target kaldırıldı

        card.innerHTML = `
          <div class="cover-wrapper">
            <img class="cover-image" src="${coverUrl}" alt="${book}" loading="lazy" onerror="this.src='https://via.placeholder.com/300x400/181b23/ffffff?text=${encodeURIComponent(book)}'">
          </div>
          <div class="book-title">${book}</div>
        `;

        grid.appendChild(card);
      });
    }

    document.addEventListener('DOMContentLoaded', renderLibrary);
  </script>
</body>
</html>
