<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Şeffaf Cam Kitaplık</title>
  <style>
    :root {
      --glass-bg: rgba(255, 255, 255, 0.15);
      --glass-border: rgba(255, 255, 255, 0.25);
      --glass-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
      --text-color: #ffffff;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      min-height: 100vh;
      background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #311042 100%);
      background-attachment: fixed;
      color: var(--text-color);
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 2rem 1rem;
    }

    h1 {
      font-weight: 600;
      letter-spacing: -0.5px;
      margin-bottom: 2rem;
      text-shadow: 0 2px 10px rgba(0,0,0,0.3);
    }

    /* Grid Yapısı: Yan yana 3 kitap */
    .bookshelf {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 1.5rem;
      width: 100%;
      max-width: 850px;
      padding: 1.5rem;
      border-radius: 24px;
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--glass-border);
      box-shadow: var(--glass-shadow);
    }

    /* Kitap Kartı (iOS Glassmorphism) */
    .book-card {
      background: var(--glass-bg);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid var(--glass-border);
      border-radius: 18px;
      padding: 1rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-decoration: none;
      color: var(--text-color);
      transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
      cursor: grab;
      user-select: none;
      box-shadow: 0 4px 15px rgba(0,0,0,0.15);
    }

    .book-card:hover {
      transform: translateY(-6px) scale(1.02);
      background: rgba(255, 255, 255, 0.22);
      border-color: rgba(255, 255, 255, 0.4);
      box-shadow: 0 12px 25px rgba(0,0,0,0.25);
    }

    .book-card:active {
      cursor: grabbing;
    }

    .book-card.dragging {
      opacity: 0.4;
      transform: scale(0.95);
    }

    /* Kitap Kapak Görseli */
    .book-cover {
      width: 100%;
      aspect-ratio: 1 / 1.41; /* Standart A4 / Kitap oranı */
      object-fit: cover;
      border-radius: 12px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
      margin-bottom: 0.8rem;
      pointer-events: none; /* Sürüklemeyi etkilememesi için */
    }

    /* Kitap Başlığı */
    .book-title {
      font-size: 0.95rem;
      font-weight: 500;
      text-align: center;
      word-break: break-word;
      line-height: 1.3;
      text-shadow: 0 1px 3px rgba(0,0,0,0.5);
    }

    @media (max-width: 600px) {
      .bookshelf {
        grid-template-columns: repeat(2, 1fr); /* Küçük ekranlarda 2'li düzen */
        gap: 1rem;
        padding: 1rem;
      }
    }
  </style>
</head>
<body>

  <h1>Kitaplık</h1>

  <div class="bookshelf" id="bookshelf">
    <!-- Kitaplar JavaScript ile dynamic yüklenecek -->
  </div>

  <script>
    // 1. Örnek Base URL ve Kitap Verileri
    // Sen klasöründeki isimleri bu listeye yazacaksın.
    const BASE_URL = "https://ornek-siteniz.com/klasor/";

    const initialBooks = [
      { id: "1", name: "nutuk", title: "Nutuk", cover: "nutuk/page_1.jpg" },
      { id: "2", name: "simyaci", title: "Simyacı", cover: "simyaci/page_1.jpg" },
      { id: "3", name: "sefiller", title: "Sefiller", cover: "sefiller/page_1.jpg" },
      { id: "4", name: "1984", title: "1984", cover: "1984/page_1.jpg" },
      { id: "5", name: "otostopcu", title: "Otostopçunun Galaksi Rehberi", cover: "otostopcu/page_1.jpg" }
    ];

    const bookshelf = document.getElementById('bookshelf');

    // LocalStorage'dan sıralamayı oku veya varsayılanı kullan
    function getSavedOrder() {
      const saved = localStorage.getItem('bookshelf_order');
      if (saved) {
        const orderIds = JSON.parse(saved);
        // Kaydedilen ID sıralamasına göre objeleri diz
        const ordered = [];
        orderIds.forEach(id => {
          const found = initialBooks.find(b => b.id === id);
          if (found) ordered.push(found);
        });
        // Yeni eklenen ama kayıtta olmayan kitaplar varsa sona ekle
        initialBooks.forEach(b => {
          if (!ordered.find(o => o.id === b.id)) ordered.push(b);
        });
        return ordered;
      }
      return initialBooks;
    }

    // Sıralamayı LocalStorage'a kaydet
    function saveOrder() {
      const currentCards = document.querySelectorAll('.book-card');
      const orderIds = Array.from(currentCards).map(card => card.dataset.id);
      localStorage.setItem('bookshelf_order', JSON.stringify(orderIds));
    }

    // Kitapları Ekrana Bas
    function renderBooks() {
      bookshelf.innerHTML = '';
      const booksToRender = getSavedOrder();

      booksToRender.forEach(book => {
        const card = document.createElement('a');
        card.className = 'book-card';
        card.href = `${BASE_URL}${book.name}.html`;
        card.target = '_blank'; // Yeni sekmede açılması için
        card.draggable = true;
        card.dataset.id = book.id;

        card.innerHTML = `
          <img class="book-cover" src="${book.cover}" alt="${book.title}" onerror="this.src='https://via.placeholder.com/150x210/ffffff/000000?text=Kapak+Yok'">
          <div class="book-title">${book.name}.html</div>
        `;

        // Drag & Drop Eventleri
        addDragEvents(card);

        bookshelf.appendChild(card);
      });
    }

    // Drag & Drop Mantığı
    let draggedItem = null;

    function addDragEvents(item) {
      item.addEventListener('dragstart', (e) => {
        draggedItem = item;
        setTimeout(() => item.classList.add('dragging'), 0);
      });

      item.addEventListener('dragend', () => {
        draggedItem.classList.remove('dragging');
        draggedItem = null;
        saveOrder(); // Sürükleme bitince yeni düzeni kaydet
      });

      item.addEventListener('dragover', (e) => {
        e.preventDefault();
        const afterElement = getDragAfterElement(bookshelf, e.clientX, e.clientY);
        if (afterElement == null) {
          bookshelf.appendChild(draggedItem);
        } else {
          bookshelf.insertBefore(draggedItem, afterElement);
        }
      });
    }

    // Fare pozisyonuna göre en yakın kartı bulma
    function getDragAfterElement(container, x, y) {
      const draggableElements = [...container.querySelectorAll('.book-card:not(.dragging)')];

      return draggableElements.reduce((closest, child) => {
        const box = child.getBoundingClientRect();
        // Kartın merkezine göre mesafe hesabı
        const offsetX = x - box.left - box.width / 2;
        const offsetY = y - box.top - box.height / 2;
        
        // Basit yakınlık algoritması
        if (offsetX < 0 && offsetY < 0) {
          return { offset: offsetX + offsetY, element: child };
        } else {
          return closest;
        }
      }, { offset: Number.NEGATIVE_INFINITY }).element;
    }

    // İlk yükleme
    renderBooks();
  </script>
</body>
</html>
