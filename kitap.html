<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Katalog Listesi</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #0f172a; color: #fff; padding: 15px; }
    
    .header { position: sticky; top: 0; background: #0f172a; padding-bottom: 10px; z-index: 10; }
    .search-input { width: 100%; padding: 12px 16px; background: #1e293b; border: 1px solid #334155; border-radius: 10px; color: #fff; font-size: 15px; outline: none; }
    
    .list-container { display: flex; flex-direction: column; gap: 8px; margin-top: 10px; }
    .list-item { background: #1e293b; border: 1px solid #334155; padding: 14px 16px; border-radius: 10px; text-decoration: none; color: #f8fafc; font-size: 15px; font-weight: 500; display: flex; justify-content: space-between; align-items: center; transition: background 0.2s; }
    .list-item:active { background: #334155; }
    .arrow { color: #64748b; font-size: 18px; }
    
    .empty-msg { text-align: center; color: #64748b; margin-top: 40px; font-size: 14px; }
  </style>
</head>
<body>

<div class="header">
  <input type="text" id="searchBox" class="search-input" placeholder="Katalog veya firma ara...">
</div>

<div class="list-container" id="catalogList"></div>

<script>
  // Klasördeki mevcut HTML dosyalarının listesi
  // (Silinen dosyayı buradan kaldırmanız, yeni ekleneni buraya yazmanız yeterlidir)
  let htmlFiles = [
    "AUDIO 2026-2-Fiyat-Listesi-web.html",
    "AYKA 2026.html",
    "BEMIS 2026.html",
    "CHINT 2026.html",
    "ÇEBI 2025_ocred.html",
    "ÇET-SAN 2026 Fiyat Listesi.html",
    "CATA 2026.html",
    "GÜNSAN 2026.html"
  ];

  const catalogList = document.getElementById('catalogList');
  const searchBox = document.getElementById('searchBox');

  // Türkçe Karakter Destekli Alfabetik Sıralama (A-Z)
  function sortFilesAlphabetically(files) {
    return files.sort((a, b) => a.localeCompare(b, 'tr', { sensitivity: 'base' }));
  }

  // Dosya adını temizleme (Uzantıyı ve gereksiz karakterleri kaldırır)
  function cleanFileName(fileName) {
    return fileName.replace(/\.[^/.]+$/, "").trim();
  }

  // Listeyi Ekrana Basma Fonksiyonu
  function renderList(filter = '') {
    catalogList.innerHTML = '';
    
    // 1. Önce Türkçe alfabeye göre sırala
    const sortedFiles = sortFilesAlphabetically(htmlFiles);

    let count = 0;
    sortedFiles.forEach(file => {
      const displayName = cleanFileName(file);
      
      // Arama filtresi kontrolü
      if (!filter || displayName.toLowerCase().includes(filter.toLowerCase())) {
        const a = document.createElement('a');
        a.className = 'list-item';
        a.href = file; // Tıklayınca doğrudan ilgili HTML sayfasına gider
        a.innerHTML = `<span>${displayName}</span><span class="arrow">›</span>`;
        catalogList.appendChild(a);
        count++;
      }
    });

    if (count === 0) {
      catalogList.innerHTML = '<div class="empty-msg">Katalog bulunamadı.</div>';
    }
  }

  // Arama Kutusu Dinleyicisi
  searchBox.addEventListener('input', (e) => {
    renderList(e.target.value);
  });

  // İlk Açılışta Listele
  renderList();
</script>

</body>
</html>
